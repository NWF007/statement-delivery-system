# =============================================================================================
#  Secure Statement Delivery Platform - local stack.
#
#      cp .env.example .env && docker compose up --build
#
#  Nothing here needs a manual step. Every dependency declares a health check and every consumer
#  waits on it, so a cold start on a clean clone converges on its own rather than depending on
#  whichever container happened to win the race.
#
#  Topology note: services NEVER connect to PostgreSQL directly. They go through PgBouncer on
#  6432, on a per-workload pool. Only db-migrator talks to 5432, because DDL needs a session it
#  owns and CREATEROLE, which no running service has.
#  See docs/adr/0008-pgbouncer-transaction-pooling.md.
# =============================================================================================

name: statement-delivery

# ---------------------------------------------------------------------------------------------
#  Shared fragments. Every service gets the same observability and shutdown configuration; a
#  service that had to remember it for itself is a service that will eventually forget.
# ---------------------------------------------------------------------------------------------
x-observability: &observability
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  # Emitted on every span, metric and log as a resource attribute.
  OTEL_SERVICE_NAME: ${COMPOSE_PROJECT_NAME:-statement-delivery}

x-dotnet: &dotnet
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  ASPNETCORE_HTTP_PORTS: "8080"
  DOTNET_EnableDiagnostics: "0"

x-service-deps: &service-deps
  db-migrator:
    condition: service_completed_successfully
  pgbouncer:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy
  # ADDED IN PROMPT 4. A healthy MinIO is not the same thing as a PROVISIONED bucket, and since
  # Prompt 4 the difference is observable: ObjectLockHealthCheck is tagged `ready`, so a service
  # that starts before `createbuckets` finishes reports NOT READY until the next probe. Without
  # this the stack still converges, but `docker compose up` shows unready services for no reason a
  # reader can see, and a FAILED `mc retention set` shows up only as a readiness flap rather than
  # stopping the stack. One-shot container, no restart policy, so completed_successfully is the
  # correct condition and it needs no health check of its own.
  createbuckets:
    condition: service_completed_successfully
  aspire-dashboard:
    # service_started, NOT service_healthy, and deliberately so. A telemetry backend must never
    # gate application startup: if the dashboard is down the correct behaviour is a service that
    # runs and drops its telemetry, not a service that refuses to start.
    condition: service_started

services:
  # -------------------------------------------------------------------------------------------
  #  Data stores
  # -------------------------------------------------------------------------------------------
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # SCRAM rather than md5. md5 is deprecated and offline-crackable.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command:
      - postgres
      # D9: slow queries must be visible during development, not discovered in production.
      - -c
      - log_min_duration_statement=200
      # Headroom above the four per-workload PgBouncer pools (20+20+40+5 = 85) plus the migrator
      # and any human with psql. PgBouncer is what keeps this number small enough to be sane.
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      # Streaming replication for the opt-in `replica` profile.
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready, not a query: the question is "is the server accepting connections", and a
      # health check that runs SQL becomes part of the load during an incident.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [statement-delivery]

  # Optional streaming replica, so the ConnectionIntent read/write split can be exercised locally.
  # NOT started by default:  docker compose --profile replica up -d postgres-replica
  postgres-replica:
    image: postgres:17.11-alpine
    profiles: [replica]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    # Clones the primary on first start, then runs as a hot standby. -R writes standby.signal and
    # primary_conninfo, which is what makes it stream rather than sit as a frozen copy.
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          rm -rf /var/lib/postgresql/data/*
          pg_basebackup -h postgres -p 5432 -U "${POSTGRES_USER}" -D /var/lib/postgresql/data -Fp -Xs -R
          chown -R postgres:postgres /var/lib/postgresql/data
          chmod 0700 /var/lib/postgresql/data
        fi
        exec su-exec postgres postgres
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [statement-delivery]

  # Writes PgBouncer's auth file from .env, so no password is ever committed. One-shot: it exits
  # as soon as the file exists, and PgBouncer waits for that exit before starting.
  pgbouncer-config:
    image: postgres:17.11-alpine
    environment:
      APP_DELIVERY_PASSWORD: ${APP_DELIVERY_PASSWORD}
      APP_DOWNLOAD_PASSWORD: ${APP_DOWNLOAD_PASSWORD}
      APP_GENERATION_PASSWORD: ${APP_GENERATION_PASSWORD}
      APP_RETENTION_PASSWORD: ${APP_RETENTION_PASSWORD}
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD}
    command:
      - sh
      - -c
      - |
        set -e
        umask 077
        cat > /userlist/userlist.txt <<USERLIST
        "app_delivery" "$${APP_DELIVERY_PASSWORD}"
        "app_download" "$${APP_DOWNLOAD_PASSWORD}"
        "app_generation" "$${APP_GENERATION_PASSWORD}"
        "app_retention" "$${APP_RETENTION_PASSWORD}"
        "pgbouncer" "$${PGBOUNCER_ADMIN_PASSWORD}"
        USERLIST
        echo "pgbouncer userlist written"
    volumes:
      - pgbouncer-userlist:/userlist
    networks: [statement-delivery]

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer-config:
        condition: service_completed_successfully
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    volumes:
      - ./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - pgbouncer-userlist:/etc/pgbouncer/userlist:ro
    healthcheck:
      # A TCP probe rather than a query. Authenticating would need a credential inside the health
      # check, and the question here is only "is the pooler listening".
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [statement-delivery]

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [statement-delivery]

  # -------------------------------------------------------------------------------------------
  #  Object storage
  # -------------------------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [statement-delivery]

  # ⚠ PROMPT 4 REMEDIATION - THE BUCKET IS NOW CREATED WITH OBJECT LOCK, AND IT HAD TO BE RECREATED.
  #
  # The original definition created the bucket and enabled versioning. It did NOT enable Object
  # Lock, and OBJECT LOCK CANNOT BE ENABLED ON AN EXISTING BUCKET: MinIO requires it at creation
  # time (`mc mb --with-lock`), and so does S3. Newer MinIO AIStor releases relax this; the
  # community image pinned above does not - and since S3 has the same constraint, the local
  # environment should mirror production behaviour rather than mask it.
  #
  # Consequence, stated plainly: THIS IS NOT A CONFIG CHANGE. An existing bucket must be destroyed
  # and recreated:
  #
  #     docker compose down -v && docker compose up --build -d
  #
  # Anything less leaves the old lock-less bucket in place and every Object Lock operation fails
  # with a confusing error. Locally that costs nothing. In production it would be a 470 TB
  # migration - which is exactly why it is worth getting right in the scaffold.
  createbuckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STATEMENTS_BUCKET: ${STATEMENTS_BUCKET}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"

        # --with-lock. Enabling object locking also enables versioning PERMANENTLY - versioning can
        # then never be disabled, which is the property that makes the immutability claim real
        # rather than a setting somebody can turn off during an incident.
        mc mb --with-lock --ignore-existing "local/$${STATEMENTS_BUCKET}"

        # COMPLIANCE, NOT GOVERNANCE. Governance mode lets a sufficiently privileged user shorten
        # or bypass retention, which makes it a convention with a strongly worded name rather than
        # a control. For a regulatory record that is not sufficient. 2555d is seven years, in days
        # rather than years so the value is unambiguous and matches RetentionPolicy.Default.
        #
        # This is the BUCKET DEFAULT. The application still sets a mode per object, and in
        # Development it sets GOVERNANCE so a developer can delete test objects - see
        # ObjectLockOptions for why that asymmetry is deliberate rather than sloppy.
        mc retention set --default COMPLIANCE 2555d "local/$${STATEMENTS_BUCKET}"
        mc anonymous set none "local/$${STATEMENTS_BUCKET}"

        # These two print the RESULTING configuration, so the container logs prove the settings
        # applied rather than merely that the commands were issued. If they print nothing, the
        # bucket is wrong and every object written to it is unretained.
        mc version info "local/$${STATEMENTS_BUCKET}"
        mc retention info "local/$${STATEMENTS_BUCKET}"
        echo "bucket $${STATEMENTS_BUCKET} ready with object lock (COMPLIANCE 2555d) and versioning"
    networks: [statement-delivery]

  # -------------------------------------------------------------------------------------------
  #  Observability
  # -------------------------------------------------------------------------------------------
  #  One container instead of Jaeger + Prometheus + Grafana + Seq. It accepts OTLP and renders
  #  traces, metrics and structured logs in one UI. See ADR-0004 for why there is no Aspire
  #  AppHost: the deliverable is a Dockerfile per service and a compose file, and an AppHost is a
  #  different orchestration model that would duplicate or contradict both.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5.2
    restart: unless-stopped
    environment:
      # Local development only. The dashboard has no persistence and no tenancy; it must never be
      # exposed beyond a developer machine.
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
    networks: [statement-delivery]

  # -------------------------------------------------------------------------------------------
  #  Schema migration - runs once, exits 0, and gates everything else.
  # -------------------------------------------------------------------------------------------
  db-migrator:
    build:
      context: .
      dockerfile: src/Migrations/Db.Migrator/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *dotnet
      # DIRECT to PostgreSQL on 5432, not through PgBouncer. DDL needs a session it owns, and
      # V001 needs CREATEROLE.
      Migration__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Migration__AppDeliveryPassword: ${APP_DELIVERY_PASSWORD}
      Migration__AppDownloadPassword: ${APP_DOWNLOAD_PASSWORD}
      Migration__AppGenerationPassword: ${APP_GENERATION_PASSWORD}
      Migration__AppRetentionPassword: ${APP_RETENTION_PASSWORD}
      Migration__AppMigratorPassword: ${APP_MIGRATOR_PASSWORD}
    restart: "no"
    networks: [statement-delivery]

  # -------------------------------------------------------------------------------------------
  #  Services
  # -------------------------------------------------------------------------------------------
  delivery-api:
    build:
      context: .
      dockerfile: src/Services/Delivery.Api/Dockerfile
    restart: unless-stopped
    depends_on: *service-deps
    environment:
      <<: [*dotnet, *observability]
      OTEL_SERVICE_NAME: delivery-api
      Postgres__PrimaryConnectionString: Host=pgbouncer;Port=6432;Database=statements_delivery;Username=app_delivery;Password=${APP_DELIVERY_PASSWORD}
      Postgres__ReplicaConnectionString: ${POSTGRES_REPLICA_CONNECTION}
      Cache__ConnectionString: redis:6379
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__DevelopmentSigningKey: ${JWT_DEV_SIGNING_KEY}
      Jwt__RequireHttpsMetadata: "false"
      # The link points at the GATEWAY, a different service on a different port. Issuing and
      # redeeming are separate deployables precisely so a flood against the public one cannot
      # exhaust the authenticated one.
      DownloadLinks__GatewayBaseUrl: http://localhost:${DOWNLOAD_GATEWAY_PORT:-8082}
      # Prompt 6: the legal-hold endpoints set and release OBJECT-STORE holds (dual-layer
      # enforcement, ADR-0037), so this service now holds storage credentials - scoped, in
      # production IAM, to Get/PutObjectLegalHold and nothing else. It still cannot read or
      # write statement content: it registers no content store.
      ObjectStorage__ServiceUrl: http://minio:9000
      ObjectStorage__BucketName: ${STATEMENTS_BUCKET}
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${DELIVERY_API_PORT:-8081}:8080"
    networks: [statement-delivery]

  download-gateway:
    build:
      context: .
      dockerfile: src/Services/Download.Gateway/Dockerfile
    restart: unless-stopped
    depends_on: *service-deps
    environment:
      <<: [*dotnet, *observability]
      OTEL_SERVICE_NAME: download-gateway
      Postgres__PrimaryConnectionString: Host=pgbouncer;Port=6432;Database=statements_download;Username=app_download;Password=${APP_DOWNLOAD_PASSWORD}
      Postgres__ReplicaConnectionString: ${POSTGRES_REPLICA_CONNECTION}
      Cache__ConnectionString: redis:6379
      ObjectStorage__ServiceUrl: http://minio:9000
      ObjectStorage__BucketName: ${STATEMENTS_BUCKET}
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      # GOVERNANCE in Development so test objects can be cleaned up; COMPLIANCE in Staging and
      # Production. Set explicitly rather than defaulted, in both directions - see ObjectLockOptions.
      ObjectStorage__Lock__Mode: GOVERNANCE
      Crypto__KeyProvider: Local
      Crypto__LocalKeys__MasterSecret: ${CRYPTO_MASTER_SECRET}
    ports:
      - "${DOWNLOAD_GATEWAY_PORT:-8082}:8080"
    # THE statement-content VOLUME IS GONE. It backed the Prompt 3 filesystem adapter behind
    # IStatementContentStore, which the encrypting object-storage adapter has replaced. A volume
    # nothing reads is somewhere stale plaintext sits until someone finds it.
    networks: [statement-delivery]

  # The mock core-banking ledger. A REAL network boundary for the generation fleet's resilience
  # policies: latency injection, error injection, and a rate limit that answers 429 with
  # Retry-After. Deliberately references nothing else in this repository.
  mockledger:
    build:
      context: .
      dockerfile: src/Services/MockLedger.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      FaultInjection__LatencyMs__P50: "20"
      FaultInjection__LatencyMs__P99: "200"
      FaultInjection__ErrorRate: "0.0"
      FaultInjection__RateLimitPerSecond: "500"
    ports:
      - "8083:8080"
    networks: [statement-delivery]

  generation-worker:
    build:
      context: .
      dockerfile: src/Services/Generation.Worker/Dockerfile
    restart: unless-stopped
    depends_on: *service-deps
    environment:
      <<: [*dotnet, *observability]
      OTEL_SERVICE_NAME: generation-worker
      Postgres__PrimaryConnectionString: Host=pgbouncer;Port=6432;Database=statements_generation;Username=app_generation;Password=${APP_GENERATION_PASSWORD}
      Postgres__ReplicaConnectionString: ${POSTGRES_REPLICA_CONNECTION}
      Cache__ConnectionString: redis:6379
      ObjectStorage__ServiceUrl: http://minio:9000
      ObjectStorage__BucketName: ${STATEMENTS_BUCKET}
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      ObjectStorage__Lock__Mode: GOVERNANCE
      Crypto__KeyProvider: Local
      Crypto__LocalKeys__MasterSecret: ${CRYPTO_MASTER_SECRET}
      Ledger__BaseUrl: http://mockledger:8080
      # The licence tier is a legal declaration about the LICENSEE and belongs to the
      # deployment, not the code. See docs/LICENSING.md.
      Rendering__License: ${QUESTPDF_LICENSE:-Community}
      # CIPHERTEXT spool for the encrypt-then-upload path (ADR-0031). Defaults to the OS temp
      # path inside the container, which is the writable container layer - REAL disk. Never
      # mount this as tmpfs: tmpfs is RAM, and eight render slots spooling large statements
      # would compete with the heap the streaming design protects. Peak usage is bounded at
      # RenderParallelism x largest ciphertext (8 x ~1 MB typical = ~8 MB per replica;
      # ~80 MB for pathological 10 MB statements). The spool-directory readiness probe fails
      # the replica if this path is not writable - a read-only filesystem shows up at rollout,
      # not mid-run. Only ciphertext ever touches it; plaintext PDFs exist in memory only.
      ObjectStorage__Spool__Directory: /tmp/statement-spool
    # No published ports. This is the service that scales 0 -> 400 at month-end; a host port
    # binding would make the second replica fail to start.
    networks: [statement-delivery]

  retention-worker:
    build:
      context: .
      dockerfile: src/Services/Retention.Worker/Dockerfile
    restart: unless-stopped
    depends_on: *service-deps
    environment:
      <<: [*dotnet, *observability]
      OTEL_SERVICE_NAME: retention-worker
      Postgres__PrimaryConnectionString: Host=pgbouncer;Port=6432;Database=statements_retention;Username=app_retention;Password=${APP_RETENTION_PASSWORD}
      Postgres__ReplicaConnectionString: ${POSTGRES_REPLICA_CONNECTION}
      Cache__ConnectionString: redis:6379
      # Object storage credentials RETURN here in Prompt 6, exactly as the Prompt 5 note promised:
      # in the same commit as the purge job that needs them. This is now the ONLY service allowed
      # to DELETE an object (its production IAM: DeleteObject*, GetObjectRetention,
      # Get/PutObjectLegalHold, ListBucket, GetObject for reconciliation HEADs) - and the Object
      # Lock readiness check arrives with them.
      ObjectStorage__ServiceUrl: http://minio:9000
      ObjectStorage__BucketName: ${STATEMENTS_BUCKET}
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      ObjectStorage__Lock__Mode: GOVERNANCE
      Crypto__KeyProvider: Local
      Crypto__LocalKeys__MasterSecret: ${CRYPTO_MASTER_SECRET}
      # The compliance lifecycle's knobs. The cooling-off default (7 days) lives in code; the
      # simulated restore latency is minutes locally because a demo cannot wait four hours -
      # ADR-0038 documents what is real and what is simulated.
      Retention__Restore__SimulatedDelayMinutes: "2"
    # No published ports and no container_name, so this can be scaled to prove leader election:
    #     docker compose up -d --scale retention-worker=3
    #     docker compose logs retention-worker | grep -c "lease acquired"   # -> 1
    networks: [statement-delivery]

volumes:
  postgres-data:
  postgres-replica-data:
  minio-data:
  pgbouncer-userlist:

networks:
  statement-delivery:
    driver: bridge
