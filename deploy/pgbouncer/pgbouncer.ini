; =============================================================================================
;  PgBouncer - MANDATORY, not optional.
;
;  PostgreSQL forks a backend process per connection, each costing several megabytes, with a
;  practical ceiling in the low hundreds. Count what this system wants without a pooler:
;
;      Delivery.Api        6 replicas x pool 20   =   120
;      Download.Gateway    4 replicas x pool 20   =    80
;      Generation.Worker 400 replicas x pool  5   = 2,000   <-- the problem
;      Retention.Worker    2 replicas x pool  5   =    10
;                                                  -------
;                                                    2,210 connections
;
;  The generation fleet alone would take the database down. See
;  docs/adr/0008-pgbouncer-transaction-pooling.md, and read the trap list in
;  src/BuildingBlocks/Persistence/Connections/NpgsqlConnectionFactory.cs before writing SQL.
; =============================================================================================

[databases]
; ---------------------------------------------------------------------------------------------
;  ONE LOGICAL DATABASE PER WORKLOAD, ALL POINTING AT THE SAME PHYSICAL DATABASE.
;
;  This is what stops the month-end batch starving customer downloads. A single shared pool means
;  400 render workers can consume every server connection while the customer-facing API queues
;  behind them and starts timing out - the classic month-end incident this design exists to
;  prevent. Separate pool_size per alias makes that impossible: generation can exhaust its own
;  budget and nobody else's.
;
;  Each service connects with Database=<its own alias> and its own login role, so SHOW POOLS
;  attributes every connection to a service by name.
; ---------------------------------------------------------------------------------------------
statements_delivery   = host=postgres port=5432 dbname=statements pool_size=20
statements_download   = host=postgres port=5432 dbname=statements pool_size=20
statements_generation = host=postgres port=5432 dbname=statements pool_size=40
statements_retention  = host=postgres port=5432 dbname=statements pool_size=5

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; ---------------------------------------------------------------------------------------------
;  TRANSACTION POOLING. A server connection is returned to the pool at COMMIT, so a few dozen
;  backends can serve thousands of clients. The cost is that session state does not survive
;  between statements - see the trap list. Session pooling would remove the traps and also remove
;  the entire benefit.
; ---------------------------------------------------------------------------------------------
pool_mode = transaction

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist/userlist.txt

; ---------------------------------------------------------------------------------------------
;  PREPARED STATEMENTS IN TRANSACTION MODE.
;  PgBouncer 1.21+ tracks prepared statements per client and re-prepares them on whichever server
;  connection it routes to, which makes protocol-level prepared statements safe here. This is why
;  Npgsql auto-prepare is left ENABLED (PostgresOptions.MaxAutoPrepare, default 20).
;  Setting exactly one of the two is mandatory. Setting neither produces
;  "prepared statement S_1 already exists" under load and nowhere else.
; ---------------------------------------------------------------------------------------------
max_prepared_statements = 200

; Client connections PgBouncer will accept. Deliberately far larger than the server-side pools:
; absorbing client concurrency is the entire job.
max_client_conn = 2000

; Fallback for any database without an explicit pool_size above.
default_pool_size = 10

; Extra server connections a pool may open under a burst, above pool_size.
reserve_pool_size = 5
reserve_pool_timeout = 3

; Recycle server connections so a long-lived backend cannot accumulate memory or hold an old
; snapshot forever.
server_lifetime = 3600
server_idle_timeout = 600

; A client that has been waiting this long for a server connection is told so, rather than
; hanging. Failing fast is what lets the caller's own timeout budget mean something.
query_wait_timeout = 15

; Administrative access for SHOW POOLS / SHOW STATS. Read-only stats are separated from admin so
; monitoring never needs the credential that can PAUSE the pooler.
admin_users = pgbouncer
stats_users = pgbouncer

ignore_startup_parameters = extra_float_digits,options,search_path

; Local development only. In a deployed environment PgBouncer terminates TLS from the services
; and connects to PostgreSQL over TLS as well.
; server_tls_sslmode = require
; client_tls_sslmode = require

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
